<!DOCTYPE html>
<html>
<head>
    <title>Game Icon Generator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
        }
        canvas {
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <canvas id="iconCanvas" width="192" height="192"></canvas>
    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');
        
        // Draw a simple game icon
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(0, 0, 192, 192);
        
        ctx.fillStyle = '#2196F3';
        ctx.beginPath();
        ctx.moveTo(96, 32);
        ctx.lineTo(48, 160);
        ctx.lineTo(144, 160);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#F44336';
        ctx.beginPath();
        ctx.arc(96, 96, 24, 0, Math.PI * 2);
        ctx.fill();
        
        // Instructions
        console.log("Right-click on the canvas and select 'Save image as...' to save the icon");
        console.log("Save it as 'app-icon.png' and use it in your Android app");
    </script>
</body>
</html>
