<!DOCTYPE html>
<html>
<head>
    <title>Game Splash Screen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .splash-container {
            text-align: center;
            color: white;
        }
        
        .game-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(to right, #4CAF50, #2196F3, #F44336);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        
        .loading-text {
            font-size: 24px;
            margin-top: 30px;
            color: #aaa;
        }
        
        .loading-dots span {
            animation: blink 1.4s infinite;
            opacity: 0;
        }
        
        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        .spaceship {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            position: relative;
        }
        
        .spaceship-body {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid #4CAF50;
            margin: 0 auto;
        }
        
        .enemy {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #F44336;
            border-radius: 50%;
            top: 20px;
            left: 35px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-20px) translateX(10px); }
            100% { transform: translateY(0) translateX(0); }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <h1 class="game-title">SPACE DEFENDER</h1>
        
        <div class="spaceship">
            <div class="spaceship-body"></div>
            <div class="enemy"></div>
        </div>
        
        <div class="loading-text">
            Loading Game
            <div class="loading-dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </div>
        </div>
    </div>
</body>
</html>
